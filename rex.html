<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="">
</head>
<body>
    <div class="top-nav">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="icons">
            <i class="fas fa-th-large"></i> <i class="fas fa-bell"></i>     <div class="profile-icon">B</div>
        </div>
    </div>

    <div class="main-content">
        <h1 class="logo">Google</h1>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Search Google or type a URL" class="search-input">
            <i class="fas fa-microphone mic-icon"></i>
            <i class="fas fa-camera camera-icon"></i>
        </div>

        <div class="shortcuts">
            <div class="shortcut-item">
                <div class="shortcut-icon youtube-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="shortcut-label">rex</div>
            </div>
            <div class="shortcut-item">
                <div class="shortcut-icon pinterest-icon">IP</div>
                <div class="shortcut-label">byiiniriqro ar...</div>
            </div>
            <div class="shortcut-item">
                <div class="shortcut-icon add-icon">
                    <i class="fas fa-plus"></i>
                </div>
                <div class="shortcut-label">Add shortcut</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="customize-button">
            <i class="fas fa-pencil-alt"></i> Customize Chrome
        </div>
    </div>
</body>
</html>
